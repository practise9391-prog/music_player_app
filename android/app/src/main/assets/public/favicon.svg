<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="vinylG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a2238"/>
      <stop offset="60%" stop-color="#140f1f"/>
      <stop offset="100%" stop-color="#0a0710"/>
    </radialGradient>
    <linearGradient id="labelG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Drop Shadow -->
  <circle cx="256" cy="264" r="230" fill="rgba(0,0,0,0.5)" filter="blur(16px)" />
  <!-- Outer Bezel -->
  <circle cx="256" cy="256" r="236" fill="#2d3345" stroke="#4b5563" stroke-width="3" />
  <!-- Vinyl Body -->
  <circle cx="256" cy="256" r="226" fill="url(#vinylG)" />
  <!-- Grooves -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" />
  <!-- Center Label -->
  <circle cx="256" cy="256" r="105" fill="url(#labelG)" filter="url(#glow)" />
  <!-- Label Radians -->
  <circle cx="256" cy="256" r="85" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2" stroke-dasharray="6,4" />
  <!-- Spindle -->
  <circle cx="256" cy="256" r="32" fill="#e5e7eb" stroke="#9ca3af" stroke-width="3" />
  <circle cx="256" cy="256" r="14" fill="#0f0c16" />
  <!-- Play Icon Glow -->
  <polygon points="248,236 276,256 248,276" fill="#ffffff" filter="url(#glow)" />
</svg>