<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Cosmic Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d17" />
      <stop offset="50%" stop-color="#161233" />
      <stop offset="100%" stop-color="#2a144e" />
    </linearGradient>

    <!-- Note Gradient Left (Cyan to Purple) -->
    <linearGradient id="note-left-grad" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="70%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Note Gradient Right (Purple to Pink) -->
    <linearGradient id="note-right-grad" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="60%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>

    <!-- Top Beam Gradient -->
    <linearGradient id="beam-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="glow-cyan" cx="30%" cy="75%" r="40%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-magenta" cx="70%" cy="65%" r="40%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </radialGradient>

    <!-- Filter for soft drop shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="4" stdDeviation="24" flood-color="#8b5cf6" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Squircle App Icon Background -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg-grad)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="3" />

  <!-- Background Acoustic Radial Glows -->
  <circle cx="160" cy="380" r="180" fill="url(#glow-cyan)" />
  <circle cx="360" cy="320" r="180" fill="url(#glow-magenta)" />

  <!-- Acoustic Concentric Soundwave Arcs -->
  <g fill="none" stroke="rgba(168, 85, 247, 0.18)" stroke-width="6" stroke-linecap="round">
    <circle cx="256" cy="256" r="210" stroke-dasharray="12 16" />
    <circle cx="256" cy="256" r="175" stroke-dasharray="8 12" />
  </g>

  <!-- Glowing Musical Symbol Group with Filter -->
  <g filter="url(#shadow)">
    <!-- Left Note Head (Rotated Ellipse) -->
    <ellipse cx="168" cy="365" rx="58" ry="44" transform="rotate(-22 168 365)" fill="url(#note-left-grad)" />
    <!-- Left Note Head Gloss Accent -->
    <ellipse cx="158" cy="355" rx="30" ry="18" transform="rotate(-22 158 355)" fill="rgba(255,255,255,0.4)" />

    <!-- Right Note Head (Rotated Ellipse) -->
    <ellipse cx="344" cy="318" rx="58" ry="44" transform="rotate(-22 344 318)" fill="url(#note-right-grad)" />
    <!-- Right Note Head Gloss Accent -->
    <ellipse cx="334" cy="308" rx="30" ry="18" transform="rotate(-22 334 308)" fill="rgba(255,255,255,0.4)" />

    <!-- Left Stem -->
    <rect x="195" y="135" width="26" height="230" rx="13" fill="url(#note-left-grad)" />

    <!-- Right Stem -->
    <rect x="372" y="98" width="26" height="220" rx="13" fill="url(#note-right-grad)" />

    <!-- Primary Top Connecting Beam -->
    <polygon points="195,135 398,98 398,148 195,185" fill="url(#beam-grad)" />

    <!-- Secondary Harmonic Beam Accent -->
    <polygon points="195,198 398,161 398,182 195,219" fill="rgba(236, 72, 153, 0.85)" />

    <!-- Central Dynamic Equalizer Pulse Bars -->
    <g fill="none" stroke-linecap="round">
      <line x1="248" y1="230" x2="248" y2="330" stroke="#00f0ff" stroke-width="14" stroke-opacity="0.9" />
      <line x1="284" y1="190" x2="284" y2="350" stroke="#a855f7" stroke-width="16" />
      <line x1="320" y1="210" x2="320" y2="310" stroke="#ec4899" stroke-width="14" stroke-opacity="0.9" />
    </g>
  </g>
</svg>